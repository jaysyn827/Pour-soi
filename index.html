<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour-soi</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
body { background:#0f0f0f; color:white; text-align:center; }
header { padding:80px 20px 40px; }
h1 { font-size:48px; letter-spacing:2px; }
p { color:#aaa; font-size:18px; margin-top:15px; }
.btn { display:inline-block; margin-top:30px; background:white; color:black; padding:15px 30px; border-radius:50px; text-decoration:none; font-weight:bold; font-size:18px; }
section { padding:50px 20px; max-width:800px; margin:auto; }
.card { background:#1c1c1c; padding:30px; border-radius:20px; margin:20px 0; text-align:left; }
.card h2 { margin-bottom:10px; }
.card p { color:#bbb; }
footer { padding:30px; color:#666; font-size:14px; }
</style>
</head>
<body>
<header>
<h1>POUR-SOI</h1>
<p>Bienvenue sur mon site officiel.</p>
<a class="btn" href="#">Me suivre</a>
</header>
<section>
<div class="card">
<h2>🔥 Mon univers</h2>
<p>Découvre mon contenu, mes projets et mes nouveautés.</p>
</div>
<div class="card">
<h2>🎬 Mes vidéos</h2>
<p>Retrouve toutes mes dernières vidéos ici.</p>
</div>
<div class="card">
<h2>📩 Contact</h2>
<p>Pour me contacter, envoie-moi un message sur mes réseaux.</p>
</div>
</section>
<footer>© 2026 Pour-soi - Tous droits réservés</footer>
</body>
</html>
